<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>100天 · 一克生命</title><style>body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;color:#123946;background:#f8fbfc}a{text-decoration:none;color:inherit}.c{width:min(1160px,92%);margin:auto}header{background:#fff;border-bottom:1px solid #d7eaed;position:sticky;top:0;z-index:10}nav{min-height:76px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand img{width:54px}.links{display:flex;gap:18px;font-weight:800}.hero{padding:64px 0 24px}.banner{background:linear-gradient(135deg,#0d6b7d,#1a9aa4 62%,#1ca58d);color:#fff;border-radius:28px;padding:40px}.banner h1{font-size:clamp(2.5rem,6vw,4.8rem);line-height:1.08;margin:0 0 12px}.banner p{max-width:760px;color:#e4f6f7;font-size:1.08rem}.current{display:inline-flex;margin-top:10px;padding:9px 14px;border-radius:999px;background:#ffffff20;border:1px solid #ffffff50;font-weight:900}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:26px 0 70px}.day{background:#fff;border:1px solid #d7eaed;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #12394610;cursor:pointer}.day img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.day b{display:block;padding:12px;text-align:center;color:#117f96}.day.today{border:3px solid #1ca58d}.day.today b{background:#1ca58d;color:#fff}.modal{display:none;position:fixed;inset:0;z-index:50;background:#062d35e8;padding:24px;align-items:center;justify-content:center}.modal.open{display:flex}.box{width:min(760px,96vw);background:#fff;border-radius:20px;padding:14px}.box img{width:100%;max-height:75vh;object-fit:contain}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.btn{border:0;background:#117f96;color:#fff;padding:10px 14px;border-radius:999px;font-weight:900;cursor:pointer}footer{background:#083f4b;color:#d2e9ec;padding:34px 0}@media(max-width:850px){.links{display:none}.days{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.days{grid-template-columns:repeat(2,1fr)}}</style><link rel="stylesheet" href="../mobile.css"><link rel="alternate" hreflang="zh" href="https://ruzheva.github.io/edin-gram-jivot/zh/days.html"><link rel="alternate" hreflang="bg" href="https://ruzheva.github.io/edin-gram-jivot/days.html"><link rel="alternate" hreflang="x-default" href="https://ruzheva.github.io/edin-gram-jivot/days.html"><script src="/edin-gram-jivot/language-switcher.js" defer></script></head><body><header><div class="c"><nav><a class="brand" href="index.html"><img src="../logo-edin-gram-jivot-web.png"><span>一克生命</span></a><div class="links"><a href="programs.html">项目</a><a href="hobby.html">兴趣俱乐部</a><a href="conferences.html">会议</a><a href="films.html">使命电影</a><a href="days.html">100天</a><a href="../days.html">BG</a></div></nav></div></header><main><section class="hero"><div class="c"><div class="banner"><h1>100天。100条信息。一个选择。</h1><p>“一克生命”系列的原创视觉内容，围绕选择、关系、家庭、预防与人性。</p><div class="current" id="currentDay">今天 · 第67天</div></div><div class="days" id="gallery"></div></div></section></main><footer><div class="c"><b>一克生命</b></div></footer><div class="modal" id="modal" onclick="if(event.target===this)closeDay()"><div class="box"><img id="big" alt=""><div class="bar"><b id="title"></b><div><button class="btn" onclick="shareDay()">分享</button> <button class="btn" onclick="closeDay()">关闭</button></div></div></div></div><script>function sofiaDay(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Sofia',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v={};p.forEach(x=>v[x.type]=x.value);const today=Date.UTC(+v.year,+v.month-1,+v.day),base=Date.UTC(2026,7,30);return Math.max(1,Math.min(100,67+Math.floor((today-base)/86400000)))}const CURRENT_DAY=sofiaDay();currentDay.textContent=`今天 · 第${CURRENT_DAY}天`;const g=document.getElementById('gallery');function dayFile(n){let s=String(n).padStart(2,'0');return n<=57?`../den-${s}.jpg`:`../${n}.jpg`}g.innerHTML=Array.from({length:CURRENT_DAY},(_,i)=>CURRENT_DAY-i).map(d=>{let n=String(d).padStart(2,'0');return `<article class="day${d===CURRENT_DAY?' today':''}" id="day-${n}" onclick="openDay(${d})"><img loading="lazy" src="${dayFile(d)}" alt="一克生命 — 第${d}天"><b>${d===CURRENT_DAY?'今天 · ':''}第 ${n} 天</b></article>`}).join('');let current=CURRENT_DAY;function openDay(n){current=n;let s=String(n).padStart(2,'0');big.src=dayFile(n);title.textContent=`第 ${s} 天 · 一克生命`;modal.classList.add('open');document.body.style.overflow='hidden'}function closeDay(){modal.classList.remove('open');document.body.style.overflow=''}async function shareDay(){let url=new URL(dayFile(current),location.href).href;if(navigator.share){try{await navigator.share({title:`一克生命 — 第${current}天`,url});return}catch(e){}}if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('链接已复制。')}}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDay()});</script></body></html>
