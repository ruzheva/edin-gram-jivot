name: Apply mobile stylesheet

on:
  push:
    branches: [main]
    paths:
      - 'mobile.css'
      - '.github/workflows/mobile-optimize.yml'

permissions:
  contents: write

jobs:
  apply-mobile-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link mobile stylesheet in HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = '<link rel="stylesheet" href="mobile.css">'
          changed = []
          for p in Path('.').glob('*.html'):
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  continue
              if '</head>' in text:
                  text = text.replace('</head>', marker + '</head>', 1)
                  p.write_text(text, encoding='utf-8')
                  changed.append(p.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit updated pages
        run: |
          if git diff --quiet; then
            echo "No HTML changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Apply mobile responsive stylesheet"
          git push
