_,i)=>D-i).map(d=>{let n=String(d).padStart(2,'0');return `<article class="day${d===D?' today':''}" id="day-${n}" onclick="openDay(${d})"><img loading="lazy" src="${f(d)}"><b>${d===D?'HEUTE · ':''}TAG ${n}</b></article>`}).join('');let current=D;function openDay(n){current=n;big.src=f(n);title.textContent=`TAG ${String(n).padStart(2,'0')} · Ein Gramm Leben`;modal.classList.add('open')}function closeDay(){modal.classList.remove('open')}async function shareDay(){let url=new URL(f(current),location.href).href;if(navigator.share){try{await navigator.share({title:`Ein Gramm Leben — Tag ${current}`,url});return}catch(e){}}if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('Link kopiert.')}}</script></body></html>
