ing:34px 0}@media(max-width:850px){.links{display:none}.days{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.days{grid-template-columns:repeat(2,1fr)}}</style><link rel="stylesheet" href="../mobile.css"><link rel="alternate" hreflang="bg" href="https://ruzheva.github.io/edin-gram-jivot/days.html"><link rel="alternate" hreflang="en" href="https://ruzheva.github.io/edin-gram-jivot/en/days.html"><link rel="alternate" hreflang="es" href="https://ruzheva.github.io/edin-gram-jivot/es/days.html"><link rel="alternate" hreflang="fr" href="https://ruzheva.github.io/edin-gram-jivot/fr/days.html"><link rel="alternate" hreflang="x-default" href="https://ruzheva.github.io/edin-gram-jivot/days.html"></head><body><header><div class="c"><nav><a class="brand" href="index.html"><img src="../logo-edin-gram-jivot-web.png" alt=""><span>UN GRAMME DE VIE</span></a><div class="links"><a href="programs.html">Programmes</a><a href="hobby.html">Club loisirs</a><a href="conferences.html">Conférences</a><a href="films.html">Films avec une mission</a><a href="days.html">100 jours</a><a class="lang" href="../days.html">BG</a></div></nav></div></header><main><section class="hero"><div class="c"><div class="banner"><h1>100 JOURS. 100 MESSAGES. UN CHOIX.</h1><p>Les visuels originaux de la série « Un gramme de vie » sur les choix, les relations, la famille, la prévention et l’humanité.</p><div class="current" id="currentDay">AUJOURD’HUI · JOUR</div></div><div class="days" id="gallery"></div></div></section></main><footer><div class="c"><b>UN GRAMME DE VIE</b></div></footer><div class="modal" id="modal" onclick="if(event.target===this)closeDay()"><div class="box"><img id="big" alt=""><div class="bar"><b id="title"></b><div><button class="btn" onclick="shareDay()">Partager</button> <button class="btn" onclick="closeDay()">Fermer</button></div></div></div></div><script>function sofiaDay(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Sofia',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v={};p.forEach(x=>v[x.type]=x.value);const today=Date.UTC(+v.year,+v.month-1,+v.day);const base=Date.UTC(2026,7,30);return Math.max(1,Math.min(100,67+Math.floor((today-base)/86400000)))}const CURRENT_DAY=sofiaDay();currentDay.textContent=`AUJOURD’HUI · JOUR ${CURRENT_DAY}`;function dayFile(n){let s=String(n).padStart(2,'0');return n<=57?`../den-${s}.jpg`:`../${n}.jpg`}gallery.innerHTML=Array.from({length:CURRENT_DAY},(_,i)=>CURRENT_DAY-i).map(d=>{let n=String(d).padStart(2,'0');return `<article class="day${d===CURRENT_DAY?' today':''}" id="day-${n}" onclick="openDay(${d})"><img loading="lazy" src="${dayFile(d)}"><b>${d===CURRENT_DAY?'AUJOURD’HUI · ':''}JOUR ${n}</b></article>`}).join('');let current=CURRENT_DAY;function openDay(n){current=n;big.src=dayFile(n);title.textContent=`JOUR ${String(n).padStart(2,'0')} · Un gramme de vie`;modal.classList.add('open')}function closeDay(){modal.classList.remove('open')}async function shareDay(){let url=new URL(dayFile(current),location.href).href;if(navigator.share){try{await navigator.share({title:`Un gramme de vie — Jour ${current}`,url});return}catch(e){}}if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('Lien copié.')}}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDay()});</script></body></html>
